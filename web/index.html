<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex Token Meter</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/dashboard.css?v=4"></head>
<body>
<header><div><span class="brand">Codex Token Meter</span><span class="sub">实时、可核验的本地 Codex 用量</span></div><div class="header-actions"><span id="sse" class="pill offline">SSE 连接中</span><a href="/logout">退出</a></div></header>
<main>
  <section id="cards" class="cards"></section>
  <section class="toolbar">
    <select id="period"><option value="today">今天</option><option value="24h">最近24小时</option><option value="week">本周</option><option value="month">本月</option><option value="all">自定义时间（全部）</option></select>
    <input id="from" type="datetime-local" title="自定义开始时间"><input id="to" type="datetime-local" title="自定义结束时间"><button id="applyRange" class="secondary">应用时间</button>
    <input id="filter" placeholder="筛选主机 / 项目 / 模型 / 会话">
    <button id="addWindows">添加 Windows 电脑</button><button id="addLinux" class="secondary">添加 Linux VPS</button>
    <button id="addPurchase" class="secondary">录入 Credits 购买批次</button>
    <a href="/api/export?format=csv">CSV</a><a href="/api/export?format=json">JSON</a>
  </section>
  <section class="panel"><div class="panel-title"><h2>按设备与项目聚拢的会话</h2><span id="updated">等待数据</span></div><div id="sessionGroups" class="session-groups"></div></section>
</main>
<dialog id="dialog"><button class="close" id="close">×</button><h2 id="dialogTitle">详情</h2><div id="dialogBody"></div></dialog>
<script src="/app.js?v=4"></script></body></html>
